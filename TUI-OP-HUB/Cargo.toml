[package]
name = "tui-op-hub"
version = "0.2.0"
edition = "2021"
description = "A terminal user interface (TUI) operations hub built in Rust"
license = "MIT OR Apache-2.0"
repository = ""
readme = "../README.md"

[dependencies]
# Async runtime (US-NF-02)
tokio = { version = "1", features = ["full"] }

# Structured logging (US-NF-04)
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

# Database (US-NF-06, US-NF-07)
sqlx = { version = "0.8", features = [
    "runtime-tokio-rustls",
    "sqlite",
    "macros",
    "migrate",
] }

# Error handling (US-NF-08)
anyhow = "1"
thiserror = "2"

# Serialization (US-APP-06)
serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml = "0.8"

# API (US-API-01)
axum = "0.8"
tower = "0.5"
tower-http = { version = "0.6", features = ["trace", "cors"] }

# TUI (US-TUI-*)
ratatui = "0.29"
crossterm = "0.28"

# Clipboard (US-CMD-08)
arboard = "3"

# Lua embedding (US-WF-04, US-PLG-02)
mlua = { version = "0.10", features = ["lua54", "vendored", "send"] }

# Process & Resource Management (US-PROC-01..07)
sysinfo = "0.32"

# YAML support (US-WF-03)
serde_yaml = "0.9"

# Misc
chrono = { version = "0.4", features = ["serde"] }
uuid = { version = "1", features = ["v4", "serde"] }
chacha20poly1305 = "0.10"
rand = "0.8"
base64 = "0.21"
getrandom = "0.2"

# Authentication & Security (US-SEC-11..15)
argon2 = "0.5"
zeroize = "1.7"

# Workflow Scheduler (US-WF-07)
cron = "0.12"

# Plugin System (US-PLG-01)
libloading = "0.8"

[profile.release]
# Single binary optimization (US-NF-05)
opt-level = 3
lto = true
codegen-units = 1
strip = true